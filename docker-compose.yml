version: '3.8'

services:
  # --- 1. Rust Gateway (Ultra-High Performance Entry Point) ---
  sentineli-gateway:
    build: ./gateway
    container_name: sentineli_gateway
    ports:
      - "8765:8080"
    environment:
      - RUST_LOG=info
      - GATEWAY_PORT=8080
      - BACKEND_URL=http://kg-ai-cobol-modernize:3050
    depends_on:
      - kg-ai-cobol-modernize
    networks:
      - modernist-net
    restart: unless-stopped

  # --- 2. Knowledge Graph-AI/ML Cobol Modernize Engine ---
  kg-ai-cobol-modernize:
    build: .
    image: kg-ai-cobol-modernize
    container_name: kg_ai_cobol_modernizer
    expose:
      - "3050"  # Internal only, accessed through Rust gateway
    # Development direct access (comment out in production)
    ports:
      - "8766:3050"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3050
      # DATABASE_URL and REDIS_URL are still set here to use internal docker aliases
      - DATABASE_URL=postgres://admin:secure_pass@db:5432/kg_cobol_db
      - REDIS_URL=redis://cache:6379
      # Ollama runs on the Mac host — inside Docker, localhost = container loopback.
      # host.docker.internal resolves to the Mac host from inside any container.
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2:3b
    depends_on:
      - db
      - cache
    command: npm run dev
    networks:
      - modernist-net

  # --- 3. Persistence Layer (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    container_name: kg_cobol_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_pass
      POSTGRES_DB: kg_cobol_db
    ports:
      - "54320:5432"  # External access on unpopular port
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - modernist-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kg_cobol_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 4. Caching Layer (Redis) ---
  cache:
    image: redis:alpine
    container_name: kg_cobol_redis
    restart: always
    ports:
      - "6385:6379"
    volumes:
      - redisdata:/data
    networks:
      - modernist-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 5. Dashboard UI (React + Vite) ---
  dashboard:
    build: ./dashboard
    container_name: sentineli_dashboard
    ports:
      - "3100:3100"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://kg-ai-cobol-modernize:3050
    depends_on:
      - kg-ai-cobol-modernize
    networks:
      - modernist-net
    command: npm run dev -- --host 0.0.0.0

# --- Networks & Volumes ---
networks:
  modernist-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
