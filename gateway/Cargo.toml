[package]
name = "sentineli-gateway"
version = "1.0.0"
edition = "2021"
authors = ["Ricky Anh Nguyen <ricky@orchesity.com>"]
description = "Ultra-high-performance Rust gateway for Sentineli mainframe modernization"
license = "MIT"

[dependencies]
actix-web = "4.5"
actix-rt = "2.9"
actix-cors = "0.7"
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
env_logger = "0.11"
log = "0.4"
dotenv = "0.15"
chrono = "0.4"
jsonwebtoken = "10"
lazy_static = "1.4"
prometheus = { version = "0.14", features = ["process"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
