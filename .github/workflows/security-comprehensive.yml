name: 7-Step Security & Quality Gate

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18.x'
  RUST_VERSION: '1.88.0'
  FAIL_ON_SEVERITY: 'high'

jobs:
  # ==================== STEP 1: Dependency Security Audit ====================
  step-1-dependency-audit:
    name: "Step 1/7: Dependency Security Audit"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install dependencies (Root)
        run: npm ci

      - name: Install dependencies (Dashboard)
        run: cd dashboard && npm ci

      - name: Run npm audit (Root)
        run: |
          echo "🔍 Auditing root package dependencies..."
          npm audit --audit-level=${{ env.FAIL_ON_SEVERITY }} --json > npm-audit-root.json || true
          npm audit --audit-level=${{ env.FAIL_ON_SEVERITY }}

      - name: Run npm audit (Dashboard)
        run: |
          echo "🔍 Auditing dashboard dependencies..."
          cd dashboard
          npm audit --audit-level=${{ env.FAIL_ON_SEVERITY }} --json > npm-audit-dashboard.json || true
          npm audit --audit-level=${{ env.FAIL_ON_SEVERITY }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit (Rust Gateway)
        run: |
          echo "🔍 Auditing Rust dependencies..."
          cd gateway
          cargo audit --json > cargo-audit.json || true
          cargo audit

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            npm-audit-root.json
            dashboard/npm-audit-dashboard.json
            gateway/cargo-audit.json
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          echo "✅ Step 1/7 Complete: Dependency Security Audit"
          if [ -f npm-audit-root.json ]; then
            critical=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-root.json)
            high=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-root.json)
            if [ "$critical" -gt 0 ] || [ "$high" -gt 0 ]; then
              echo "❌ Found $critical critical and $high high severity vulnerabilities in root"
              exit 1
            fi
          fi

  # ==================== STEP 2: Static Code Analysis ====================
  step-2-static-analysis:
    name: "Step 2/7: Static Code Analysis (SAST)"
    runs-on: ubuntu-latest
    needs: step-1-dependency-audit
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with security plugin
        run: |
          echo "🔍 Running ESLint with security rules..."
          npm run lint

      - name: Run Clippy (Rust)
        run: |
          echo "🔍 Running Clippy for Rust code..."
          cd gateway
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: Run Prettier check
        run: npm run format:check

      - name: Success message
        run: echo "✅ Step 2/7 Complete: Static Code Analysis"

  # ==================== STEP 3: License Compliance Check ====================
  step-3-license-compliance:
    name: "Step 3/7: License Compliance Check"
    runs-on: ubuntu-latest
    needs: step-2-static-analysis
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Check licenses (Root)
        run: |
          echo "📜 Checking licenses for root dependencies..."
          license-checker --json --out license-report-root.json
          license-checker --summary

      - name: Check licenses (Dashboard)
        run: |
          echo "📜 Checking licenses for dashboard dependencies..."
          cd dashboard
          license-checker --json --out license-report-dashboard.json
          license-checker --summary

      - name: Check for prohibited licenses
        run: |
          echo "🔍 Checking for prohibited licenses..."
          PROHIBITED_LICENSES=("GPL-3.0" "AGPL-3.0" "SSPL-1.0")
          
          for license in "${PROHIBITED_LICENSES[@]}"; do
            if grep -q "$license" license-report-root.json; then
              echo "❌ Found prohibited license: $license in root dependencies"
              exit 1
            fi
          done
          
          echo "✅ No prohibited licenses found"

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-reports
          path: |
            license-report-root.json
            dashboard/license-report-dashboard.json
          retention-days: 30

      - name: Success message
        run: echo "✅ Step 3/7 Complete: License Compliance Check"

  # ==================== STEP 4: Secret Scanning ====================
  step-4-secret-scanning:
    name: "Step 4/7: Secret Scanning"
    runs-on: ubuntu-latest
    needs: step-3-license-compliance
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better secret detection

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

      - name: Scan for hardcoded secrets in code
        run: |
          echo "🔍 Scanning for potential hardcoded secrets..."
          
          # Check for common secret patterns
          if grep -r -E "(password|secret|api_key|token|private_key)\s*=\s*['\"][^'\"]{8,}" \
             --include="*.js" --include="*.ts" --include="*.jsx" --include="*.tsx" \
             --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=.git . ; then
            echo "⚠️  Warning: Found potential hardcoded secrets"
            echo "Please review the findings above"
            # Don't fail here, let gitleaks be the authority
          fi

      - name: Check for exposed credentials in configs
        run: |
          echo "🔍 Checking configuration files..."
          
          # Check .env files are not committed
          if find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*" | grep -q .; then
            echo "❌ Found .env files in repository!"
            find . -name ".env" -not -path "./node_modules/*" -not -path "./.git/*"
            exit 1
          fi
          
          echo "✅ No .env files found in repository"

      - name: Success message
        run: echo "✅ Step 4/7 Complete: Secret Scanning"

  # ==================== STEP 5: Advanced SAST (Snyk) ====================
  step-5-advanced-sast:
    name: "Step 5/7: Advanced SAST (Snyk)"
    runs-on: ubuntu-latest
    needs: step-4-secret-scanning
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

      - name: Run Snyk Code Analysis
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test

      - name: Alternative SAST with Semgrep
        if: ${{ !env.SNYK_TOKEN }}
        run: |
          echo "🔍 Running Semgrep as alternative SAST..."
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep \
            --config=auto \
            --json \
            --output=semgrep-results.json \
            /src || true

      - name: Upload SAST reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            snyk-*.json
            semgrep-results.json
          retention-days: 30

      - name: Success message
        run: echo "✅ Step 5/7 Complete: Advanced SAST"

  # ==================== STEP 6: Container Security Scan ====================
  step-6-container-security:
    name: "Step 6/7: Container Security Scan"
    runs-on: ubuntu-latest
    needs: step-5-advanced-sast
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Root)
        run: |
          echo "🐳 Building main application Docker image..."
          docker build -t sentineli:test .

      - name: Build Docker image (Dashboard)
        run: |
          echo "🐳 Building dashboard Docker image..."
          cd dashboard
          docker build -t sentineli-dashboard:test .

      - name: Build Docker image (Gateway)
        run: |
          echo "🐳 Building gateway Docker image..."
          cd gateway
          docker build -t sentineli-gateway:test .

      - name: Run Trivy scan on main image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sentineli:test'
          format: 'sarif'
          output: 'trivy-sentineli.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy scan on dashboard image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sentineli-dashboard:test'
          format: 'sarif'
          output: 'trivy-dashboard.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run Trivy scan on gateway image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sentineli-gateway:test'
          format: 'sarif'
          output: 'trivy-gateway.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: |
            trivy-sentineli.sarif
            trivy-dashboard.sarif
            trivy-gateway.sarif

      - name: Check Trivy results
        run: |
          echo "📊 Analyzing container scan results..."
          
          # Check for critical vulnerabilities
          if grep -q "CRITICAL" trivy-*.sarif; then
            echo "❌ Critical vulnerabilities found in container images"
            echo "Review the SARIF reports for details"
            exit 1
          fi
          
          echo "✅ No critical container vulnerabilities found"

      - name: Success message
        run: echo "✅ Step 6/7 Complete: Container Security Scan"

  # ==================== STEP 7: Test Coverage & Quality Gates ====================
  step-7-quality-gates:
    name: "Step 7/7: Test Coverage & Quality Gates"
    runs-on: ubuntu-latest
    needs: step-6-container-security
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol

      - name: Install dependencies
        run: npm ci

      - name: Compile COBOL programs
        run: npm run compile

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db

      - name: Run unit tests with coverage
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Run Rust tests (Gateway)
        run: |
          echo "🧪 Running Rust tests..."
          cd gateway
          cargo test --all-features

      - name: Check coverage thresholds
        run: |
          echo "📊 Checking coverage thresholds..."
          
          # Extract coverage percentage from Jest
          COVERAGE=$(node -e "
            const coverage = require('./coverage/coverage-summary.json');
            const lines = coverage.total.lines.pct;
            const branches = coverage.total.branches.pct;
            const functions = coverage.total.functions.pct;
            const statements = coverage.total.statements.pct;
            
            console.log('Lines:', lines);
            console.log('Branches:', branches);
            console.log('Functions:', functions);
            console.log('Statements:', statements);
            
            const MIN_COVERAGE = 80;
            if (lines < MIN_COVERAGE || branches < MIN_COVERAGE || 
                functions < MIN_COVERAGE || statements < MIN_COVERAGE) {
              process.exit(1);
            }
          " || echo "FAILED")
          
          if [ "$COVERAGE" == "FAILED" ]; then
            echo "❌ Coverage below 80% threshold"
            exit 1
          fi
          
          echo "✅ Coverage meets quality gates (≥80%)"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          badges-directory: badges
          generate-branches-badge: true
          generate-summary: true

      - name: Quality Gate Final Check
        run: |
          echo "🎯 Running final quality gate checks..."
          
          # Check for TODO/FIXME in production code
          TODO_COUNT=$(grep -r "TODO\|FIXME" src/ --include="*.js" | wc -l || echo 0)
          if [ "$TODO_COUNT" -gt 50 ]; then
            echo "⚠️  Warning: Found $TODO_COUNT TODO/FIXME comments"
          fi
          
          # Check code complexity (example - adjust as needed)
          echo "✅ All quality gates passed"

      - name: Success message
        run: |
          echo "✅ Step 7/7 Complete: Test Coverage & Quality Gates"
          echo ""
          echo "🎉 ALL 7 SECURITY & QUALITY CHECKS PASSED!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✓ Step 1: Dependency Security Audit"
          echo "✓ Step 2: Static Code Analysis (SAST)"
          echo "✓ Step 3: License Compliance Check"
          echo "✓ Step 4: Secret Scanning"
          echo "✓ Step 5: Advanced SAST (Snyk/Semgrep)"
          echo "✓ Step 6: Container Security Scan"
          echo "✓ Step 7: Test Coverage & Quality Gates"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ==================== FINAL: Security Report ====================
  security-summary:
    name: "📊 Security Summary Report"
    runs-on: ubuntu-latest
    needs: step-7-quality-gates
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate security summary
        run: |
          echo "# 🔒 Security & Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ All 7 Steps Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 1/7 | Dependency Security Audit | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 2/7 | Static Code Analysis | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 3/7 | License Compliance | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 4/7 | Secret Scanning | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 5/7 | Advanced SAST | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 6/7 | Container Security | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| 7/7 | Quality Gates | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "# ❌ Security Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "One or more security checks failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
